name: nova

# One command on the server: docker compose up -d --build
# Caddy is the only public entry point and issues HTTPS certificates for SITE_ADDRESS automatically.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova}
      POSTGRES_DB: nova
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  api:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://nova:${POSTGRES_PASSWORD:-nova}@db:5432/nova
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backups:/backups:ro  # admin panel shows backup status
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    restart: unless-stopped

  backup:
    build: ./backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-nova}
      TZ: ${TZ:-Europe/Moscow}
      BACKUP_TIME: ${BACKUP_TIME:-04:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Off-site copy (Timeweb Cloud → Хранилище S3). Empty S3_BUCKET = local only.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-nova}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.twcstorage.ru}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-ru-1}
    volumes:
      - ./backups:/backups
    depends_on:
      api:  # migrations applied first, so even the first dump has the schema
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
